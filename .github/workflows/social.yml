name: Threads 자동 게시

# 하루 24회, 매시 정각(UTC).
#
# 언어는 시각으로 갈린다 — 영어 16회 + 스페인어 8회.
# 어느 시각이 어느 언어인지는 scripts/variants.mjs 의 ES_HOURS 한 줄에 있다.
#
#   스페인어 (UTC 02·04·07·12·15·17·20·22)
#     스페인 저녁과 멕시코·중남미 저녁에 맞췄다.
#   영어 (나머지 16칸)
#     미국 동부 기준 출근길·점심·퇴근길·취침 전이 모두 들어간다.
#
# 문안 풀은 영어 32개 / 스페인어 24개다. 하루에 쓰는 만큼 순서대로 소진하므로
# 영어는 이틀, 스페인어는 사흘에 한 바퀴 돈다. 같은 글이 하루에 두 번 나가지 않는다.
#
# 스레드 API 한도는 24시간당 250개다. 24회는 10% 수준이라 정책상 여유가 크다.
# 진짜 상한은 API가 아니라 사람이 질리는 속도이므로, 지표를 보고 조정한다.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      lang:
        description: "언어 (비워두면 시각에 따라 자동)"
        required: false
        type: choice
        options: ["", "en", "es"]
        default: ""
      theme:
        description: "주제 (비워두면 순서대로 자동)"
        required: false
        type: choice
        options: ["", "quiz", "routine", "spf", "idols"]
        default: ""
      post_id:
        description: "문구 id (비워두면 순서대로 자동)"
        required: false
        type: string
        default: ""

jobs:
  threads:
    name: 스레드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 도메인을 사면 이 변수만 갱신하면 된다.
          SITE_URL: ${{ vars.SITE_URL || 'https://idol-skin-lab.vercel.app' }}
          # LANG 은 리눅스 예약 환경변수라 이름을 따로 쓴다
          LANG_OVERRIDE: ${{ inputs.lang }}
          THEME: ${{ inputs.theme }}
          POST_ID: ${{ inputs.post_id }}
        shell: bash
        run: |
          # pipefail이 없으면 node가 죽어도 tee의 성공 코드로 덮여 실패가 감춰진다
          set -o pipefail
          node scripts/social-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"
